{% extends "layout.html" %}
{% block title %}Import Template — DataValidator{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Import Template</h1>
  <a href="{{ url_for('template_list') }}" class="btn btn-secondary">← Back</a>
</div>

<div class="card">
  <p>Upload a <code>.json</code> template file. It will be validated and added to the template library.</p>
  <form method="post" action="{{ url_for('template_import_post') }}" enctype="multipart/form-data">
    <div class="form-group">
      <label for="file">Template JSON file</label>
      <input type="file" id="file" name="file" accept=".json" required/>
    </div>
    <button type="submit" class="btn btn-primary">Import</button>
  </form>
</div>
{% endblock %}
